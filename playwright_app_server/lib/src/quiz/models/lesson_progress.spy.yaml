### A player's best result for a lesson.
class: LessonProgress
table: lesson_progress
fields:
  authUser: module:serverpod_auth_core:AuthUser?, relation(onDelete=Cascade)
  lessonId: String
  bestCorrect: int
  total: int
  ### 0 to 3 stars for the best attempt.
  stars: int
  attempts: int
  lastPlayedAt: DateTime
indexes:
  lesson_progress_user_lesson_idx:
    fields: authUserId, lessonId
    unique: true
