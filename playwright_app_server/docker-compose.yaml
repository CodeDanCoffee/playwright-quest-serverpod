services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: playwright_app
      POSTGRES_PASSWORD: "DemuzQ7a_XF8JuAVJIAyRZCrCol6gU5e"
    volumes:
      - playwright_app_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "nAC2bYM13zq8SesYEExcCWepkdZzAMwW"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: playwright_app_test
      POSTGRES_PASSWORD: "8gg3QNtI_nk4U0KKcrvRRwlT7bp4RJjV"
    volumes:
      - playwright_app_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "UDI6pjx-4SUn4AqrETFE7ni_w2q3hqBV"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  playwright_app_data:
  playwright_app_test_data:
